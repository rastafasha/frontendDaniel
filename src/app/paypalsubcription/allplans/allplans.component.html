<app-loading *ngIf="isLoading"></app-loading>

<div *ngIf="!user || user === null || user === undefined && !isLoading">
    <div class="container  mt-3 mb-3 d-flex justify-center ">
        <div class="col-xs-12">
            <div class="card">
                <div class="card-body text-center bg-light">
                    <p>Registrate o Inicia Sesión para Subscribirte!</p>
                </div>

                <div class="card-footer bg-light border-0 pb-4 pt-0 d-flex justify-center">
                    <button class="btn btn-vinotinto btn-lg" [routerLink]="['/login']">
                        <i class="fa fa-user"></i> Login / Registro
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="container py-5" *ngIf="!isLoading && user">
    <!-- Forzamos una sola fila que alinee todo al centro y arriba -->
    <div class="row g-4 justify-content-center align-items-stretch">

        <!-- 1. PLAN GRATUITO (Ocupa 3/12 columnas en Desktop) -->
        <div class="col-12 col-md-6 col-lg-3 d-flex">
            <div class="card w-100 shadow-sm border-0 h-100">
                <div class="card-header bg-info text-white text-center py-4 border-0">
                    <div class="plan-icon mb-2">
                        <i class="fa fa-3x fa-gift"></i>
                    </div>
                    <h5 class="fw-bold mb-0">Plan Gratuito</h5>
                    <p class="small mb-0">$0 / mes</p>
                </div>
                <div class="card-body text-center d-flex flex-column">
                    <p class="card-text mb-3 small">Ideal para empezar a leer.</p>
                    <div class="features small mb-auto">
                        <p class="mb-2"><i class="fa fa-check text-success me-2"></i>3 artículos al mes</p>
                        <p class="mb-2"><i class="fa fa-check text-success me-2"></i>Soporte básico</p>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 pb-4">
                    <button class="btn w-100 rounded-pill fw-bold"
                        [ngClass]="perfil.plan === 'free' ? 'btn-light disabled' : 'btn-outline-info'"
                        (click)="activarPlanGratis()">
                        {{ perfil.plan === 'free' ? 'Tu Plan Actual' : 'Activar Gratis' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. PLANES DE PAYPAL (Cada uno ocupa 3/12 columnas en Desktop) -->
        <ng-container *ngFor="let plan of planPaypals">
            <div class="col-12 col-md-6 col-lg-3 d-flex" *ngIf="plan.status === 'ACTIVE'">
                <div class="card w-100 shadow-sm border-0 h-100">
                    <div class="card-header bg-vinotinto text-white text-center py-4 border-0">
                        <div class="plan-icon mb-2">
                            <i class="fa fa-3x" [ngClass]="{
                'fa-calendar': plan.name.toLowerCase().includes('mensual'),
                'fa-star': plan.name.toLowerCase().includes('trimestral'),
                'fa-diamond': plan.name.toLowerCase().includes('anual')
              }"></i>
                        </div>
                        <h5 class="fw-bold mb-0">{{plan.name}}</h5>
                        <p class="small mb-0">Premium</p>
                    </div>
                    <div class="position-relative" *ngIf="plan.name.toLowerCase().includes('mensual')">
                        <span
                            class="position-absolute top-0 start-50 translate-middle badge rounded-pill bg-warning text-dark shadow-sm">
                            MÁS POPULAR
                        </span>
                    </div>
                    <div class="card-body text-center d-flex flex-column">
                        <p class="card-text mb-3 small">Acceso ilimitado al contenido.</p>
                        <div class="features small mb-auto">
                            <p class="mb-2"><i class="fa fa-check text-success me-2"></i>Soporte 24/7</p>
                            <p class="mb-2"><i class="fa fa-check text-success me-2"></i>Contenido Premium</p>
                            <p><i class="fa fa-check text-success me-2"></i>Sin publicidad</p>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 pb-4">
                        <button class="btn btn-vinotinto w-100 rounded-pill shadow-sm fw-bold"
                            (click)="openViewModal(plan)">
                            Obtener Plan
                        </button>
                    </div>
                </div>
            </div>
        </ng-container>

    </div>
</div>
