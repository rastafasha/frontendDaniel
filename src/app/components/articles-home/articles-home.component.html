<!-- article -->
<div class="col-xs-12" 
     infiniteScroll 
     [infiniteScrollDistance]="2" 
     [infiniteScrollThrottle]="50" 
     (scrolled)="getPosts()">

  @for (product of posts(); track product._id) { 
    <!-- Nota: Asegúrate de si es .id o ._id por MongoDB -->
    <app-product-item [product]="product"></app-product-item>
  }

  @if (loading()) {
    <div class="text-center p-3">
      <p>Cargando más productos...</p>
    </div>
  }

  @if (!hasMore() && posts().length > 0) {
    <p class="text-center">No hay más productos para mostrar.</p>
  }
</div>
