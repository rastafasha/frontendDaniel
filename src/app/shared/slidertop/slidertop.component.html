<div class="slider">
    <app-loading *ngIf="loading"></app-loading>
    <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel" *ngIf="!loading">
        <div class="carousel-inner" >
            <div class="carousel-item " *ngFor="let banner of banners; let i=index " [ngClass]="(i === 0) ? 'active' : ''">
                <div class="BannPpal">
                    <div class="container">
                        <div class="inf">
                            <h1 [ngClass]="banner.color" class="Up {{banner.is_activeText}}">{{banner.titulo}}</h1>
                            <div [ngClass]="banner.colortext"[innerHtml]="banner.description | safe: 'html' "></div>
                            <div class="text-center">
                                <a *ngIf="banner.target ==='_blank'" href="{{banner.url}}" target="{{banner.target}}" [ngClass]="banner.colortextboton" class="btn btn-outline-dann {{banner.gotBoton}}">
                                    {{banner.botonName}}  
                                </a>
                                <a *ngIf="banner.target ==='_self'" routerLink="{{banner.url}}" target="{{banner.target}}" [ngClass]="banner.colortextboton" class="btn btn-outline-dann {{banner.gotBoton}}">
                                    {{banner.botonName}}  
                                </a>

                            </div>
                        </div>
                    </div>
                    <img [src]="banner.img | imagenPipe: 'banners'" alt=" {{banner.title}}">
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-target="#carouselExampleIndicators" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-target="#carouselExampleIndicators" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
        </button>
    </div>
</div>
